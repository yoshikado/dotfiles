# ==========================
# General Settings
# ==========================

# Fix colors and enable true color support (crucial for modern editors)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse mode (scrolling, selecting panes, resizing)
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Super fast escape time (vital for Vim/Neovim users)
set -s escape-time 0

# ==========================
# Keybindings
# ==========================

# Easy reload of config: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Split panes (and preserve current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-mode for copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy" # Use "xclip -in -selection clipboard" on Linux

# ==========================
# Plugins & Theme
# ==========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clean, modern, low-overhead theme (Catppuccin Mocha)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"

# Initialize TPM (must stay at the very bottom)
run '~/.tmux/plugins/tpm/tpm'